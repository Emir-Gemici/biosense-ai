name: Source and data protection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check public files and all available history
        run: python scripts/check_public_repo.py --history
      - name: Validate Python syntax
        run: python -m compileall -q train.py apps pipelines scripts tests
      - name: Test data protection and demo workflow
        run: python -m unittest discover -s tests -v
